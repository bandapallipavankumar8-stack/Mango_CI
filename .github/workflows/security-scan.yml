name: Scan and Deploy Mango Market

on:
  push:
    branches: [ main ]

# Required permissions to auto-enable Pages and deploy
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ==========================================
  # STAGE 1: Security & Dependency Scan
  # ==========================================
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository for vulnerabilities & secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # STAGE 2: Auto-Enable & Deploy to GitHub Pages
  # ==========================================
  deploy:
    needs: security-scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          enablement: true
